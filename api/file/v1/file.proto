syntax = "proto3";

package file.v1;

import "google/api/annotations.proto";

import "google/protobuf/empty.proto";
import "google/protobuf/descriptor.proto";

option go_package = "api/file/v1;v1";

service FileService {
  rpc Upload(UploadRequest) returns (UploadReply) {
    option (google.api.http) = {
      post: "/api/v1/files/upload"
      body: "*"
    };
  }

  rpc View(ViewRequest) returns (ViewReply) {
    option (google.api.http) = {
      get: "/api/v1/files/{filename}"
    };
  }

  rpc Download(ViewRequest) returns (ViewReply) {
    option (google.api.http) = {
      get: "/api/v1/files/{filename}/download"
    };
  }
}

message UploadRequest {}
message UploadReply {
  string name = 1;
  string url  = 2;
}

message ViewRequest {
  string filename = 1;
}
message ViewReply {
  bytes content = 1;
  string content_type = 2;
}